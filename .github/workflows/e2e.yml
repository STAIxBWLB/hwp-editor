name: e2e (non-required)

# pull_request only, never the _target variant: this job runs a fork's code and
# additionally executes a binary downloaded from the network, so it must never
# hold this repository's secrets. It references none.
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, not `latest`. The engine gates on >= 0.20.0 and < 2.0.0
  # (packages/server/src/cli-engine.ts MIN_VERSION / MAX_VERSION_EXCLUSIVE),
  # so a future upstream 2.0.0 would fall outside the ceiling and turn this job
  # red overnight for reasons that are not this repository's fault.
  #
  # 1.6.x renames the command to `ahwp` and still publishes the legacy
  # `hwp-<tag>-<target>` archive and, inside it, the `hwp` compatibility binary
  # through 1.x - which is why the asset names below keep that spelling. 2.0.0
  # drops them.
  HWP_CLI_TAG: v1.6.1

jobs:
  # NON-GATING BY CONSTRUCTION.
  #
  # This job lives in its own workflow file on purpose. GitHub Actions' `needs:`
  # key can only reference job IDs defined in the same workflow, so a publishing
  # job authored in another workflow file is structurally unable to depend on
  # this one. It is also excluded from ci-ok, the required-check aggregate.
  # Keep this job in its separate advisory workflow, outside ci-ok needs.
  #
  # Settings half: `main` carries no branch protection and no rulesets today.
  # When a release workflow adds one, the check name produced by this workflow
  # must stay out of it - a required e2e would put fork-supplied code and a
  # network-downloaded binary on the release path.
  #
  # A red run here is to be TRIAGED, NOT TOLERATED. Failures stay red and emit
  # an advisory warning and step summary. This is where hwp-cli contract drift
  # appears: op-flag spellings
  # (packages/core/src/ops.ts), the segment-envelope shape
  # (packages/core/src/segments.ts) and the error markers
  # (packages/react/src/errors.ts) are all pinned to the 0.20.x contract and
  # enforced by cli-engine.ts's flag handshake. The pinned tag tracks the
  # newest upstream release the contract was verified against (1.6.1 keeps the
  # v2 segment envelope, render-layout-v1 and edit-ops-v1 contracts; the envelope
  # it emits is schema 1.1, which only adds an optional `source_chars` per run
  # that packages/core/src/segments.ts does not project), so what this job
  # detects from here is drift BETWEEN the floor and the next upstream release,
  # the next time either the tag or the floor moves. It is the only automated
  # evidence that the pinned contract holds against a real binary; a red check
  # nobody reads is the same as no check at all.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # pnpm before setup-node: setup-node's pnpm cache shells out to
      # `pnpm store path`. No version input - the pin comes from packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # D-05: the one job that provisions the binary. The checksum is verified
      # BEFORE extraction, so a tampered or truncated download fails the step
      # rather than being unpacked and then executed.
      #
      # The sidecar drops the archive extension - it is named
      # hwp-<tag>-<target>.sha256, not hwp-<tag>-<target>.tar.gz.sha256 -
      # while its single line still records the .tar.gz filename, so
      # `sha256sum -c` resolves the archive from the working directory. The
      # archive unpacks `ahwp` and its `hwp` compatibility name at the top level,
      # mode preserved plus the two licences and NOTICE, so no chmod is needed.
      # HWP_EDITOR_BIN names the `hwp` alias on purpose: it behaves identically,
      # and its one deprecation line goes to stderr only when stderr is a
      # terminal, so every piped call here stays byte-identical.
      - name: Install hwp-cli
        run: |
          base="https://github.com/STAIxBWLB/agent-hwp/releases/download/$HWP_CLI_TAG"
          asset="hwp-$HWP_CLI_TAG-x86_64-unknown-linux-gnu.tar.gz"
          sums="hwp-$HWP_CLI_TAG-x86_64-unknown-linux-gnu.sha256"
          curl --retry 3 --retry-all-errors -fsSL -O "$base/$asset" -O "$base/$sums"
          sha256sum -c "$sums"
          tar xzf "$asset"
          echo "HWP_EDITOR_BIN=$PWD/hwp" >> "$GITHUB_ENV"

      # HWP_EDITOR_BIN reaches the API route through the `pnpm dev` child that
      # playwright.config.ts's webServer spawns, which inherits this
      # environment; the config carries no env override precisely so it does.
      - run: pnpm --filter playground seed
      # --with-deps is the CI-only difference from the README's local command:
      # a fresh runner lacks Chromium's system libraries.
      - run: pnpm --filter playground exec playwright install --with-deps chromium
      - run: pnpm --filter playground test:e2e

      - name: Report e2e advisory failure
        if: ${{ failure() }}
        run: |
          echo "::warning title=E2E advisory::Optional e2e verification failed; inspect this job's logs."
          {
            echo '### E2E advisory failed'
            echo 'This optional check is outside ci-ok. Inspect the failed step logs before accepting CLI compatibility.'
          } >> "$GITHUB_STEP_SUMMARY"

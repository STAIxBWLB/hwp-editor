name: e2e (non-required)

# pull_request only, never the _target variant: this job runs a fork's code and
# additionally executes a binary downloaded from the network, so it must never
# hold this repository's secrets. It references none.
#
# #126: this workflow runs no job for a docs-only pull request. `paths-ignore`
# skips the run only when EVERY changed path matches, and `*.md` does not cross
# a slash, so packages/*/README.md still runs it. This trigger is not the same
# computation as ci.yml's `changes` classifier and is not meant to be: GitHub
# applies its own filter, with its own diff-size limit and whatever head it reads
# at that moment, so a pull request this workflow skips can be one ci.yml runs in
# full. The merge gate loses nothing by that, because this workflow is advisory -
# the only required check is `ci-ok` - and ci.yml answers for itself, running every
# gating job whenever it cannot prove the change is docs-only. What a skipped run
# does cost is this workflow's own signal: this pull request's e2e evidence stays
# unmeasured until someone re-runs the workflow on it.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, not `latest`. The engine gates on >= 0.20.0 and < 3.0.0
  # (packages/server/src/cli-engine.ts MIN_VERSION / MAX_VERSION_EXCLUSIVE),
  # so an upstream major bump past the ceiling would turn this job red
  # overnight for reasons that are not this repository's fault.
  #
  # 1.6.x renames the command to `ahwp` and still publishes the legacy
  # `hwp-<tag>-<target>` archive, with a `hwp` compatibility binary beside
  # `ahwp` inside it. This job fetches neither: it downloads the `ahwp-` asset
  # and installs only the `ahwp` member, so a call to the 1.x name fails here
  # rather than surfacing when 2.0.0 removes it (#121). The tag is the newest
  # 1.x release, which is what #121 asks this job to run against.
  HWP_CLI_TAG: v1.6.2

jobs:
  # NON-GATING BY CONSTRUCTION.
  #
  # This job lives in its own workflow file on purpose. GitHub Actions' `needs:`
  # key can only reference job IDs defined in the same workflow, so a publishing
  # job authored in another workflow file is structurally unable to depend on
  # this one. It is also excluded from ci-ok, the required-check aggregate.
  # Keep this job in its separate advisory workflow, outside ci-ok needs.
  #
  # Settings half: the `main: require ci-ok` ruleset is what gates a merge, and
  # its only required check is `ci-ok` (one required_status_checks context). The
  # check name produced by this workflow must stay out of that list - a required
  # e2e would put fork-supplied code and a network-downloaded binary on the
  # release path.
  #
  # A red run here is to be TRIAGED, NOT TOLERATED. Failures stay red and emit
  # an advisory warning and step summary. This is where hwp-cli contract drift
  # appears: op-flag spellings
  # (packages/core/src/ops.ts), the segment-envelope shape
  # (packages/core/src/segments.ts) and the error markers
  # (packages/react/src/errors.ts) are all pinned to the 0.20.x contract and
  # enforced by cli-engine.ts's flag handshake. The pinned tag tracks the
  # newest upstream release the contract was verified against. 1.6.2 keeps the
  # v2 segment envelope, render-layout-v1 and edit-ops-v1 contracts; its
  # envelope is schema 1.1, which only adds an optional `source_chars` per run
  # that packages/core/src/segments.ts does not project; and its edit-ops change
  # is additive, a `replace` that may carry a run address, with the edit report
  # naming inserted empty paragraphs by their paragraph id, which
  # insertedParagraphIds in packages/core/src/edit-report.ts already allows.
  # What this job detects from here is drift BETWEEN the floor and the next
  # upstream release, the next time either the tag or the floor moves. It is
  # the only automated evidence that the pinned contract holds against a real
  # binary; a red check nobody reads is the same as no check at all.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pnpm before setup-node: setup-node's pnpm cache shells out to
      # `pnpm store path`. No version input - the pin comes from packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # D-05: the one job that provisions the binary. The checksum is verified
      # BEFORE extraction, so a tampered or truncated download fails the step
      # rather than being unpacked and then executed.
      #
      # The sidecar drops the archive extension - it is named
      # ahwp-<tag>-<target>.sha256, not ahwp-<tag>-<target>.tar.gz.sha256 -
      # while its single line still records the .tar.gz filename, so
      # `sha256sum -c` resolves the archive from the working directory.
      #
      # The asset is `ahwp-<tag>-<target>` from STAIxBWLB/agent-hwp, and the
      # 1.x legacy `hwp-` name is deliberately not used (#121): proving this
      # repo needs neither it nor the `hwp` command name is half of what this
      # job is for. The archive carries `ahwp` and a `hwp` compatibility name at
      # the top level; only `ahwp` is extracted, so a stray call to the second
      # name fails here instead of surfacing when 2.0.0 removes it. The
      # directory goes on PATH rather than into HWP_EDITOR_BIN, because the
      # engine's default resolution (cli-engine.ts resolveBin) is exactly what
      # that exercises.
      - name: Install agent-hwp
        run: |
          base="https://github.com/STAIxBWLB/agent-hwp/releases/download/$HWP_CLI_TAG"
          asset="ahwp-$HWP_CLI_TAG-x86_64-unknown-linux-gnu.tar.gz"
          sums="ahwp-$HWP_CLI_TAG-x86_64-unknown-linux-gnu.sha256"
          curl --retry 3 --retry-all-errors -fsSL -O "$base/$asset" -O "$base/$sums"
          sha256sum -c "$sums"
          tar xzf "$asset" ahwp
          echo "$PWD" >> "$GITHUB_PATH"

      # PATH reaches the API route through the `pnpm dev` child that
      # playwright.config.ts's webServer spawns, which inherits this
      # environment; the config carries no env override precisely so it does.
      - run: pnpm --filter playground seed
      # #126: the browser download is the single largest fixed cost in this job
      # and does not change between runs, so the browser directory is cached;
      # only the system libraries it links against live outside the cache, and a
      # fresh runner still needs those. The key carries the installed
      # @playwright/test version, because a test-runner bump can pin a different
      # browser build and a stale cache would then be the wrong one.
      - name: Read the Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./apps/playground/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # --with-deps is the CI-only difference from the README's local command
      # on a cache miss: a fresh runner lacks both the browser and Chromium's
      # system libraries. On a hit the browser is already there, so only the
      # libraries are installed.
      - name: Install the Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter playground exec playwright install-deps chromium
          else
            pnpm --filter playground exec playwright install --with-deps chromium
          fi
      - run: pnpm --filter playground test:e2e

      - name: Report e2e advisory failure
        if: ${{ failure() }}
        run: |
          echo "::warning title=E2E advisory::Optional e2e verification failed; inspect this job's logs."
          {
            echo '### E2E advisory failed'
            echo 'This optional check is outside ci-ok. Inspect the failed step logs before accepting CLI compatibility.'
          } >> "$GITHUB_STEP_SUMMARY"

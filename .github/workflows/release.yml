name: release

# 1. TRIGGER. Tag-triggered, unlike ci.yml and e2e.yml, which are pull_request
# only. A tag arrives having passed nothing, so the verify job below re-runs the
# whole verification for this exact commit before anything irreversible happens
# (D-05, D-06). `on: release: published` was rejected because pushing a tag
# without also creating a Release is then a silent no-op, and workflow_dispatch
# with a typed version was rejected because it loosens the tie between what git
# records and what the registry receives.
#
# The filter is a glob, not a semver matcher, so `v*.*.*` also matches a
# prerelease tag such as v1.0.0-rc.1. That is deliberate: the stop for a
# mistakenly pushed tag is the environment approval on the publish job, not a
# narrower pattern. A pattern that quietly ignored some tags would make a
# mistyped tag look like a release that ran and did nothing.
#
# 2. THE E2E JOB IS UNREACHABLE FROM HERE, and must stay so. It lives alone in
# e2e.yml, and Actions' `needs:` key resolves only within one workflow file, so
# no job in this file can depend on it (PKG-10, asserted by
# packages/server/test/repo-guards.test.ts). This phase also adds NO branch
# ruleset: a required e2e check would put fork-supplied code and a
# network-downloaded binary on the release path, which is the settings half of
# the same guarantee that e2e.yml's header records.
#
# 3. NO REGISTRY INPUT ON actions/setup-node, anywhere in this file. Supplying
# one makes the action write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
# into the runner's .npmrc; with no token secret configured - which is the
# intended state under trusted publishing - the value substitutes to empty, and
# the npm CLI reads the mere presence of that line as "credentials are
# configured". It then never starts the OIDC exchange and the publish fails with
# ENEEDAUTH or a bare 404 (06-RESEARCH.md Pitfall 1, actions/setup-node#1551).
# Most tutorials online still recommend adding `registry-url` here. Do not. The
# steps below copy ci.yml's setup-node step shape verbatim, and a guard in
# repo-guards.test.ts keeps a future edit from reintroducing the input.
#
# 4. THE NPM CLI IS UPGRADED ON THE RUNNER. Node 22 bundles an npm on the 10.x
# line, which predates trusted publishing entirely; the failure that produces is
# indistinguishable from point 3's - a bare 404 at publish time, after the point
# where anything can be inspected. That is why `npm --version` is printed as a
# step rather than assumed in a comment: it is the only evidence in the job log
# that the CLI on the runner can perform the exchange at all.
#
# 5. THE ENVIRONMENT NAME IS HALF OF A BINDING, not a local setting. When a job
# targets a deployment environment, GitHub mints the OIDC token with a subject
# claim of the form repo:<owner>/<repo>:environment:<name>; without one the
# subject takes the ref form instead. The npm trusted publisher for these three
# packages is configured WITH the environment name, so the two must agree
# exactly. Dropping the environment line from the publish job is not a harmless
# simplification: it changes the subject claim, the exchange stops matching, and
# the publish fails with a bare 404 (D-07, 06-RESEARCH.md Pitfall 3). The
# approval attached to that environment is also the only human stop between a
# pushed tag and a permanent registry write.
#
# 6. THE ALREADY-PUBLISHED CHECK RUNS BEFORE THE ATTEMPT, never as a tolerated
# conflict. `--provenance` generates and uploads an attestation even when the
# publish itself fails, so swallowing a 409 leaves conflicting provenance behind
# on a version number that is permanently spent (npm/cli#7654, via
# 06-RESEARCH.md Pitfall 4). The check may therefore conclude "not published"
# only from an explicit registry 404; any other failure is a network fact, not
# an absence fact, and fails the job rather than licensing a re-publish.
#
# 7. THE WAIT AFTER CORE IS A REAL INSTALL, not a metadata poll, and each
# attempt gets a fresh cache directory. Measured against registry.npmjs.org: a
# packument is served `cache-control: public, max-age=300` from a CDN edge,
# while a tarball is `immutable`. They are different cache objects with
# different lifetimes, so a metadata read can go green - or stay stale-negative -
# independently of whether the bytes a consumer needs are servable. This is why
# `npm view` appears nowhere below. The consumer-visible failure this ordering
# prevents is npm resolving react or server, following the core peer range, and
# reporting a 404 for @hwp-editor/core (D-10, REL-05).
#
# 8. THIS WORKFLOW PROVISIONS NO hwp BINARY, and must never gain one. Nothing on
# the release path needs it: the real-binary suites in packages/server self-skip
# through describeBin, and neither release script touches it. Adding a download
# here would create exactly the network dependency on another repository's
# release schedule that ci.yml's D-04 comment exists to avoid.
#
# 9. THE WRITE SCOPE LIVES ONLY ON release-notes (D-16). The job that runs
# `npm publish` cannot write to this repository; the job that creates the
# Release cannot mint a publish token. Those Release notes are this project's
# changelog by decision - no CHANGELOG.md is maintained - which is why creating
# the Release is part of the release path rather than a manual afterthought.
#
# No repository secret is referenced anywhere below. That absence is the whole
# content of REL-02: the only credential on this path is an ephemeral OIDC
# token minted per run.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run that may be mid-publish: the second half of a cancelled
  # release is not recoverable by pushing the tag again.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm before setup-node: setup-node's pnpm cache shells out to
      # `pnpm store path`. No version input - the pin comes from packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # D-06's single cell: Node 22 with the workspace's own React 19, not
      # ci.yml's four-cell matrix. The merge already bought the matrix result
      # for this commit; what a tag has never bought is any result at all.
      #
      # Three separate steps, as in ci.yml, so a step that runs nothing stays
      # visible in the log instead of absorbed into one green line.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # D-08. EXPECTED_VERSION is attached to THIS STEP, not to the job. The
      # script skips the comparison silently when the variable is absent or
      # empty, which is what keeps ci.yml's pull-request `package` job green
      # with no tag in scope - and that same silence means a misspelling, a
      # deletion, or an `env` hoisted to job level would disable the only
      # pre-publish gate on an irreversible path while this job still reports
      # success. repo-guards.test.ts asserts the wiring for that reason.
      - name: Tag and manifests agree
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: node scripts/check-publishable.mjs

      - name: Consumer tarball smoke test
        run: node scripts/smoke-consumer.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # See header point 5: this name and the environment recorded in the npm
    # trusted-publisher configuration are one binding, not two settings.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    # Generous enough to contain the ten-minute replication wait plus three
    # publishes, and still bounded.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Header point 4. The floor is the first npm that implements trusted
      # publishing; the print below is the job's evidence that it took.
      - name: Install an npm that can perform the OIDC exchange
        run: npm install -g "npm@^11.5.1"
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - name: Derive the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          packs="$RUNNER_TEMP/packs"
          mkdir -p "$packs"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKS=$packs" >> "$GITHUB_ENV"
          echo "publishing $version from tag $GITHUB_REF_NAME"

      # ONE probe, used by both the skip check and the replication wait, because
      # they ask the same question: can a consumer install this exact version
      # right now. Written to a file and sourced by the steps below, since each
      # `run:` block is its own shell.
      - name: Write the shared registry probe
        run: |
          cat > "$RUNNER_TEMP/release-helpers.sh" <<'HELPERS'
          # registry_probe <name> <version>
          #   0  -> a real install of that exact version succeeded
          #   44 -> the registry said the version is not there (E404 / ETARGET)
          #   1  -> anything else: a blip, a 5xx, a timeout. NOT evidence of absence.
          #
          # A fresh temp dir AND a fresh cache dir per attempt are both
          # load-bearing (header point 7): --prefer-online revalidates with the
          # origin but does not control the CDN edge, and a warm cache can hold
          # a negative packument for its five-minute max-age - long enough to
          # outlive the publish that invalidated it.
          registry_probe() {
            probe_name="$1"
            probe_version="$2"
            probe_dir="$(mktemp -d)"
            probe_cache="$(mktemp -d)"
            probe_log="$(mktemp)"
            if (cd "$probe_dir" && npm install --no-audit --no-fund --no-save \
                  --cache "$probe_cache" --prefer-online \
                  "$probe_name@$probe_version") >"$probe_log" 2>&1; then
              rm -rf "$probe_dir" "$probe_cache" "$probe_log"
              return 0
            fi
            probe_status=1
            if grep -qE 'npm (error|ERR!) code (E404|ETARGET)' "$probe_log"; then
              probe_status=44
            else
              echo "probe of $probe_name@$probe_version failed for a non-404 reason:" >&2
              sed -n '1,20p' "$probe_log" >&2
            fi
            rm -rf "$probe_dir" "$probe_cache" "$probe_log"
            return "$probe_status"
          }

          # already_published <name> <version>
          #   0 -> already on the registry, skip the publish
          #   1 -> genuinely absent, publish it
          # Fails the job on "unknown" (header point 6). A single flaky attempt
          # read as absence is how a re-run re-publishes a version that already
          # landed and leaves conflicting provenance on it.
          already_published() {
            ap_attempt=1
            while :; do
              ap_status=0
              registry_probe "$1" "$2" || ap_status=$?
              if [ "$ap_status" -eq 0 ]; then
                return 0
              fi
              if [ "$ap_status" -eq 44 ]; then
                return 1
              fi
              if [ "$ap_attempt" -ge 3 ]; then
                echo "cannot tell whether $1@$2 is published: $ap_attempt attempts" \
                  "answered neither installable nor 404, so absence is not established" >&2
                exit 1
              fi
              ap_attempt=$(( ap_attempt + 1 ))
              sleep 10
            done
          }

          # wait_for_install <name> <version>
          # Retries by construction and only ever concludes success, so it needs
          # no 404-versus-unknown rule: 5s doubling to a 60s ceiling, ten-minute
          # deadline, job failed on the deadline.
          wait_for_install() {
            wf_deadline=$(( $(date +%s) + 600 ))
            wf_delay=5
            while :; do
              wf_status=0
              registry_probe "$1" "$2" || wf_status=$?
              if [ "$wf_status" -eq 0 ]; then
                echo "installable: $1@$2"
                return 0
              fi
              if [ "$(date +%s)" -ge "$wf_deadline" ]; then
                echo "timed out waiting for $1@$2 to become installable" >&2
                exit 1
              fi
              echo "$1@$2 not installable yet; retrying in ${wf_delay}s"
              sleep "$wf_delay"
              wf_delay=$(( wf_delay * 2 ))
              if [ "$wf_delay" -gt 60 ]; then
                wf_delay=60
              fi
            done
          }

          # publish_package <core|react|server>
          # D-09's split: pnpm packs, because pnpm is what substitutes the
          # workspace protocol into a real semver range, and the npm CLI uploads
          # that exact tarball, because npm is what implements the OIDC exchange
          # and the attestation. No --access flag: publishConfig.access travels
          # inside the packed manifest.
          publish_package() {
            pp_pkg="$1"
            pp_name="@hwp-editor/$pp_pkg"
            if already_published "$pp_name" "$VERSION"; then
              echo "[skip] $pp_name@$VERSION is already on the registry"
              return 0
            fi
            ( cd "packages/$pp_pkg" && pnpm pack --pack-destination "$PACKS" )
            npm publish "$PACKS/hwp-editor-$pp_pkg-$VERSION.tgz" --provenance
          }
          HELPERS
          echo "wrote $RUNNER_TEMP/release-helpers.sh"

      # REL-05's ordering is three separate steps on purpose. A single loop over
      # the three package names with the wait tucked inside a conditional would
      # behave identically at runtime and be unreviewable here.
      - name: Publish @hwp-editor/core
        run: |
          . "$RUNNER_TEMP/release-helpers.sh"
          publish_package core

      - name: Wait until core is installable from the registry
        run: |
          . "$RUNNER_TEMP/release-helpers.sh"
          wait_for_install "@hwp-editor/core" "$VERSION"

      - name: Publish @hwp-editor/react and @hwp-editor/server
        run: |
          . "$RUNNER_TEMP/release-helpers.sh"
          publish_package react
          publish_package server

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    # The only job in this file with a write scope, and it is deliberately not
    # the one that publishes (header point 9, D-16).
    permissions:
      contents: write
    steps:
      # Checked out so the gh CLI resolves this repository from the remote.
      - uses: actions/checkout@v5

      # gh is preinstalled on the runner, so no third-party action joins the
      # release path. --verify-tag refuses to invent a Release for a tag that
      # does not exist; the view-first shape makes a Re-run failed jobs after a
      # partial run a no-op rather than a duplicate-name failure.
      - name: Create the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "[skip] a Release already exists for $GITHUB_REF_NAME"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

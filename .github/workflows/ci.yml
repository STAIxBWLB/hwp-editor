name: ci

# pull_request only, never the _target variant: a fork's branch must never run
# with this repository's secrets in scope. Phase 5 needs no credential at all.
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #126: the docs-only fast path. A pull request that changes only prose
  # cannot change what build-test and package prove, and 16 of the 49 commits
  # merged to main between 2026-11-05 and 2026-11-12 were exactly that shape
  # while each still ran the full matrix. This job is the only source of that
  # answer: it reads GitHub's own list of the pull request's changed files, so
  # no checkout and no history fetch is needed.
  #
  # The rule, in one line: docs_only is true only when every changed path is
  # under `docs/` or is a `*.md` file at the repository root, no path arrived by
  # a rename from outside that set, and RELEASING.md is not among them. `*.md`
  # cannot cross a slash, so `packages/*/README.md` - which ships inside the
  # tarballs `package` checks - is NOT docs-only, and neither is anything under
  # `.github/`, `packages/`, `apps/` or `scripts/`.
  #
  # Those last two exclusions are review findings on #126, and each of them
  # would have skipped the job that proves the change:
  #
  # - A rename counts by BOTH of its paths. `gh` reports a move as
  #   `{filename: docs/x.mjs, previous_filename: scripts/smoke-consumer.mjs}`,
  #   so a jq that takes `filename` alone calls `git mv
  #   scripts/smoke-consumer.mjs docs/x.mjs` docs-only while the code that
  #   moved is what the `package` script it came from still runs.
  # - `RELEASING.md` is not prose. packages/server/test/release-guards.test.ts
  #   reads it (REL-04) under `pnpm -r test`, which build-test runs, so a pull
  #   request touching only that file has to run every gating job.
  #
  # The file list is read from the API when this job runs, not from the commit
  # the run was queued for, so the head is read too and must still be this
  # run's `pull_request.head.sha`: a push in between would otherwise hand the
  # fast path a list describing a tree nobody reviewed.
  #
  # Seven ways it fails closed, because a fast path that guesses is worse than
  # no fast path: a path outside the set, a path that only arrived by a rename
  # from outside it, a root Markdown file the tests read, a head this job could
  # not read, a head that is no longer the one the run was queued for, a list
  # that could not be read or came back empty, and a list at the API's
  # 3000-file cap where it may be truncated. `false` is written to the output
  # FIRST and overwritten only by a list that passes, so every error path costs
  # runner-minutes rather than skipping a check.
  #
  # The job itself never fails. A red `changes` would fail ci-ok through the
  # gating rule below, which would turn an API hiccup into a blocked pull
  # request; an uncomputable answer must degrade to the full run instead.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level permissions block replaces the workflow-level one for this
    # job rather than adding to it. The file list is the only thing read here.
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          # GitHub's own cap on this endpoint. At it, the list may be
          # truncated, so the answer is not provable and the run is full.
          MAX_FILES: "3000"
          # The commit this run was queued for. The file list below is read at
          # query time, so it answers for whatever the pull request stands at
          # then; the two are compared before the list is believed.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          api_head=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || {
            echo "could not read this pull request's head commit; running every gating job"
            exit 0
          }
          if [ "$api_head" != "$HEAD_SHA" ]; then
            echo "this pull request now stands at $api_head, not at this run's $HEAD_SHA;" \
              "running every gating job"
            exit 0
          fi
          # `filename` and `previous_filename`: a rename is one entry naming both
          # paths, and the old one is where the code came from (#126).
          files=$(gh api --paginate -H "Accept: application/vnd.github+json" \
            "repos/$REPO/pulls/$NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)') || {
            echo "could not read this pull request's changed files; running every gating job"
            exit 0
          }
          [ -n "$files" ] || {
            echo "this pull request reported no changed file; running every gating job"
            exit 0
          }
          total=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
          if [ "$total" -ge "$MAX_FILES" ]; then
            echo "the list reached the API's cap of $MAX_FILES files; running every gating job"
            exit 0
          fi
          outside=$(printf '%s\n' "$files" | grep -Ev '^(docs/|[^/]+\.md$)' || true)
          if [ -n "$outside" ]; then
            echo "not docs-only: $(printf '%s\n' "$outside" | head -5 | tr '\n' ' ')"
            exit 0
          fi
          # The one root Markdown file that is read back by a test, so it is
          # code for this purpose (#126): REL-04 in release-guards.test.ts.
          read_by_tests=$(printf '%s\n' "$files" | grep -Ex 'RELEASING\.md' || true)
          if [ -n "$read_by_tests" ]; then
            echo "not docs-only: RELEASING.md is read by" \
              "packages/server/test/release-guards.test.ts (REL-04)"
            exit 0
          fi
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "changed files: $total, all under docs/ or root-level *.md"

  build-test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One red cell must not hide the state of the other three.
      fail-fast: false
      matrix:
        # 22 proves the declared engines.node floor runs; 24 proves current LTS
        # does not break. The react axis exists because packages/react is the
        # only package that imports React, and its published peer range is
        # "^18 || ^19" - exactly these two values, neither more nor fewer.
        node: [22, 24]
        react: [18, 19]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # setup-node's pnpm cache shells out to `pnpm store path`, so pnpm must
      # already exist or setup-node fails with "Unable to locate executable
      # file: pnpm". Order here is load-bearing.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No version input on purpose: action-setup reads packageManager from the
      # root package.json, so this workflow cannot drift from the repo's pin.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # After the frozen install (which would reject the lockfile this writes)
      # and before the build. Scoped to the react filter only, so core and
      # server are untouched. Deliberately carries no failure tolerance: a
      # failed swap must fail the cell rather than quietly test React 19 twice.
      - name: Install React 18 for the React 18 cells
        if: matrix.react == 18
        run: |
          pnpm --filter @hwp-editor/react add -D \
            react@^18.3.1 react-dom@^18.3.1 \
            @types/react@^18.3.31 @types/react-dom@^18.3
          pnpm --filter @hwp-editor/react list --depth 0 \
            react react-dom @types/react @types/react-dom

      # Three separate steps, not one chained command, so a step that runs
      # nothing is visible in the job log instead of absorbed into a green line.
      #
      # D-04: this job deliberately provisions no hwp binary. Phase 4 built
      # packages/server/test/fake-bin.ts and lifecycle.test.ts to prove every
      # subprocess failure path with no binary present, and the remaining
      # real-binary suites skip through describeBin. CI liveness therefore does
      # not depend on another repository's release schedule. The one job that
      # does need the binary is the e2e job, in its own workflow file.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  package:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No needs: edge to build-test. Installability is a function of packaging
    # metadata, not of the runtime axis, so it need not wait for four cells.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # This job deliberately runs no `pnpm -r build` of its own. It now
      # reproduces the unguarded publish path a maintainer would take from a
      # clean checkout - clone, install, publish - so every build inside it
      # comes from the `prepack` hook in the three package manifests. A hook
      # that stops firing therefore fails this job instead of hiding behind a
      # build the job performed for it. The playground's `next build` keeps its
      # coverage in build-test, which still runs `pnpm -r build` in all four
      # matrix cells.

      # Both assertions below live in scripts/check-publishable.mjs. Three
      # things about how it is anchored, because each replaces a specific
      # failure of the shell block it supersedes:
      #
      # 1. It requires both command success and captured OUTPUT. A publish
      #    dry-run that skips a package says so silently and still exits 0, so
      #    exit status alone would report green while PKG-01 was unmet.
      # 2. It is per-package, not recursive. The recursive form consults the
      #    registry and omits any package whose version is already published;
      #    the non-recursive form names it regardless.
      # 3. It is therefore blind to registry state by construction, so
      #    publishing 1.0.0 in Phase 6 cannot turn this required job red on
      #    every subsequent pull request. Privateness is asserted from the
      #    workspace manifests rather than inferred from a dry-run staying
      #    quiet about playground.
      #
      # D-09 is unchanged: the publish dry-run still runs on every pull request.
      - name: Publish would attempt exactly the three packages
        run: node scripts/check-publishable.mjs

      # Self-packs, and the prepack hook is what builds, so it takes no
      # arguments. It wipes packages/*/dist first, which is what makes its
      # tarball assertions a proof of the hook.
      - name: Consumer tarball smoke test
        run: node scripts/smoke-consumer.mjs

  # Owner-required check: ci-ok. Advisory workflows stay outside this graph.
  #
  # #126 adds one accepted skip to the rule this job enforces, and only one:
  # `changes` succeeded, it said docs_only, and the jobs that were skipped are
  # exactly build-test and package. Every other combination is a failure,
  # including a skip announced by anything else in the graph, a docs_only answer
  # whose `changes` job did not succeed, and a docs_only answer with one of the
  # two jobs having actually run to a non-success result. The rule is written
  # this way, rather than as "allow skipped when docs_only", so that a job added
  # to this workflow later cannot silently become skippable.
  ci-ok:
    if: ${{ always() }}
    needs: [changes, build-test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gating job to succeed, or the docs-only skip
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          node <<'NODE'
          // The only skip this aggregate may pass (#126).
          const DOCS_SKIPS = ["build-test", "package"];
          const jobs = Object.entries(JSON.parse(process.env.NEEDS_JSON));
          if (jobs.length === 0) {
            console.error("No gating job reported a result");
            console.error(
              "Next step: there is no gating job log to read, because none of changes, " +
                "build-test or package reported at all. Open this run's job graph, re-run " +
                "the workflow, and if it happens again treat it as a workflow bug in `needs`.",
            );
            process.exit(1);
          }
          const failed = jobs.filter(([, job]) => job.result !== "success");
          if (failed.length === 0) {
            console.log("All gating jobs succeeded");
            process.exit(0);
          }
          const changesJob = jobs.find(([id]) => id === "changes");
          const skipped = jobs
            .filter(([, job]) => job.result === "skipped")
            .map(([id]) => id)
            .sort();
          const excusable =
            process.env.DOCS_ONLY === "true" &&
            changesJob !== undefined &&
            changesJob[1].result === "success" &&
            failed.every(([, job]) => job.result === "skipped") &&
            skipped.length === DOCS_SKIPS.length &&
            skipped.every((id, index) => id === DOCS_SKIPS[index]);
          if (excusable) {
            console.log("Docs-only pull request: build-test and package were skipped, as #126 allows");
            process.exit(0);
          }
          console.error("Gating jobs did not all succeed:", failed);
          // One next step per job, keyed on its own result: "open the log and fix
          // it" is wrong for a job that has no log to open. A cancelled job is
          // usually its timeout, and a skipped one was decided upstream.
          const nextStep = (result) => {
            switch (result) {
              case "failure":
                return (
                  "open this job's log in this run, fix what it reports, and push; " +
                  "ci-ok re-runs with the gating jobs"
                );
              case "cancelled":
                return (
                  "this job was cancelled, typically by its timeout, and produced no " +
                  "verdict on the change; re-run the job"
                );
              case "skipped":
                return (
                  "a skipped job has no log. Read the upstream job it depends on " +
                  "(build-test and package both depend on changes), which is where the " +
                  "skip was decided"
                );
              default:
                return (
                  `this job ended ${result}, which this aggregate does not classify; ` +
                  "open its log and read the step that decided that result"
                );
            }
          };
          for (const [id, job] of failed) {
            console.error(`Next step for ${id}: ${nextStep(job.result)}.`);
          }
          process.exit(1);
          NODE
